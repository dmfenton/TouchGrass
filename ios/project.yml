name: TouchGrassMobile
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.10'
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    DEVELOPMENT_TEAM: PG5D259899
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
packages:
  FentonPlatform:
    path: ../vendor/platform.dmfenton.net/swift
targets:
  TouchGrassMobile:
    type: application
    platform: iOS
    sources:
      - TouchGrass
      - ../Models/Exercise.swift
    dependencies:
      - package: FentonPlatform
        product: FentonDesignSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dmfenton.TouchGrass
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: TouchGrass/TouchGrass.entitlements
      properties:
        com.apple.developer.weatherkit: true
    info:
      path: TouchGrass/Info.plist
      properties:
        CFBundleDisplayName: Touch Grass
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSCalendarsFullAccessUsageDescription: Touch Grass reads your selected calendars on this device to avoid scheduling breaks during meetings.
        NSLocationWhenInUseUsageDescription: Touch Grass uses your approximate location to show outdoor weather.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  TouchGrassMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TouchGrassTests]
    dependencies:
      - target: TouchGrassMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dmfenton.TouchGrass.tests
        GENERATE_INFOPLIST_FILE: YES
  TouchGrassMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TouchGrassUITests]
    dependencies:
      - target: TouchGrassMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dmfenton.TouchGrass.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TouchGrassMobile:
    build:
      targets:
        TouchGrassMobile: all
    test:
      gatherCoverageData: true
      targets: [TouchGrassMobileTests, TouchGrassMobileUITests]
    archive:
      config: Release
