name: iOS Quality
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ios-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Detect iOS inputs
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["self-hosted","pr-isolated","touchgrass-pr"]' || '["self-hosted","touchgrass-docker","lilserver"]') }}
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            ios:
              - 'ios/**'
              - '.github/fenton-mobile.lock'
              - 'scripts/ios-check.sh'
              - 'scripts/codex-worktree-setup.sh'
              - 'scripts/simulator.sh'
              - 'fenton-simulator.lock'
              - 'scripts/select_ios_simulator.py'
              - 'scripts/check_ios_coverage.py'
              - '.github/workflows/ios-quality.yml'

  quality:
    name: iOS build and lint
    # Pushes and dispatches only, on the trusted Mac. The author's machine runs the full
    # `scripts/ios-check.sh` (simulator tests and coverage) before a PR opens. This job runs
    # `--no-tests` and never boots a simulator: a simulator booted first by the CI account owns the
    # host-wide cfprefsd shared-memory segment (apple.sim.cfprefs.user.daemonv) and breaks every UI
    # test in Daniel's simulators until it is unlinked (2026-11-21).
    runs-on: [self-hosted, touchgrass-macos]
    timeout-minutes: 25
    needs: changes
    if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.ios == 'true')
    # Self-hosted Macs have no passwordless sudo: select Xcode per job. They ship
    # one Xcode at /Applications/Xcode.app (the hosted image pinned Xcode_26.6.app).
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Read shared package pin
        id: platform
        run: |
          . .github/fenton-mobile.lock
          echo "sha=$FENTON_MOBILE_SHA" >> "$GITHUB_OUTPUT"
      - name: Check out shared design package
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: dmfenton/platform
          ref: ${{ steps.platform.outputs.sha }}
          path: vendor/platform.dmfenton.net
          ssh-key: ${{ secrets.FENTON_PLATFORM_DEPLOY_KEY }}
          persist-credentials: false
      # Self-hosted Macs are persistent: tools are preinstalled, never installed by a job.
      - name: Verify toolchain
        run: |
          test -d "$DEVELOPER_DIR" || { echo "missing on runner: Xcode ($DEVELOPER_DIR)"; exit 1; }
          xcodebuild -version
          for tool in xcodegen swiftlint; do
            command -v "$tool" >/dev/null || { echo "missing on runner: $tool — brew install it"; exit 1; }
          done
      - name: Check iOS without simulator tests
        run: bash scripts/ios-check.sh --no-tests
