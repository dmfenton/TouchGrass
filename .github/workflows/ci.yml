name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Pull-request code never runs on the persistent trusted runners: PRs use the
# isolated one-job touchgrass-pr pools (Linux, Linux with nested Docker, macOS).
# Pushes to main and manual dispatches use the trusted lilserver and Mac runners.
jobs:
  changes:
    name: Detect affected checks
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["self-hosted","pr-isolated","touchgrass-pr"]' || '["self-hosted","touchgrass-docker","lilserver"]') }}
    outputs:
      test: ${{ steps.filter.outputs.test }}
      lint: ${{ steps.filter.outputs.lint }}
      build: ${{ steps.filter.outputs.build }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      if: github.event_name != 'workflow_dispatch'
      id: filter
      with:
        filters: |
          test:
            - 'Controllers/**'
            - 'Managers/**'
            - 'Models/**'
            - 'Views/**'
            - 'TouchGrassTests/**'
            - 'Tests/**'
            - 'Resources/**'
            - 'Assets/**'
            - 'TouchGrassApp.swift'
            - 'TouchGrass.xcodeproj/**'
            - 'Makefile'
            - 'scripts/test.sh'
            - '.github/workflows/ci.yml'
          lint:
            - '**/*.swift'
            - '.swiftlint.yml'
            - 'TouchGrassTests/.swiftlint.yml'
            - 'ios/.swiftlint.yml'
            - 'scripts/**'
            - 'ios/project.yml'
            - 'ios/TouchGrassMobile.xcodeproj/**'
            - 'Makefile'
            - '.github/workflows/**'
          build:
            - 'Controllers/**'
            - 'Managers/**'
            - 'Models/**'
            - 'Views/**'
            - 'Resources/**'
            - 'Assets/**'
            - 'TouchGrassApp.swift'
            - 'TouchGrass.xcodeproj/**'
            - 'TouchGrass.entitlements'
            - 'Info.plist'
            - 'Local.xcconfig.example'
            - 'AppIcon.icns'
            - 'Makefile'
            - '.github/workflows/ci.yml'

  test:
    name: Test
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["self-hosted","pr-isolated-macos","touchgrass-pr-macos"]' || '["self-hosted","touchgrass-macos"]') }}
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.test == 'true'
    # Self-hosted Macs have no passwordless sudo: select Xcode per job.
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Verify toolchain
      run: |
        test -d "$DEVELOPER_DIR" || { echo "missing on runner: Xcode ($DEVELOPER_DIR)"; exit 1; }
    
    - name: Run Tests
      run: make test
    
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          build/Logs/Test/*.xcresult
          TouchGrassTests/*.log
    
  lint:
    name: Lint
    # SwiftLint and a Python source check need no macOS. SwiftLint on Linux needs
    # SourceKit from the Swift toolchain, so it runs from the pinned official image
    # (the same 0.59.1 the Mac hook uses); pull requests therefore need the
    # isolated pool with nested Docker.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["self-hosted","pr-isolated-docker","touchgrass-pr-docker"]' || '["self-hosted","touchgrass-docker","lilserver"]') }}
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.lint == 'true'
    env:
      SWIFTLINT_IMAGE: ghcr.io/realm/swiftlint:0.59.1@sha256:4002261af030eebefc377b8b5e429a3b553023d6b91cd6ea0d874d4cdaa1eaf8
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run SwiftLint
      run: |
        swiftlint() {
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" --workdir /workspace \
            "$SWIFTLINT_IMAGE" swiftlint "$@"
        }
        swiftlint lint --strict --quiet --no-cache
        swiftlint lint --strict --quiet --no-cache --config ios/.swiftlint.yml

    - name: Verify native signing policy
      run: python3 scripts/check_native_signing.py
    
  build:
    name: Build
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["self-hosted","pr-isolated-macos","touchgrass-pr-macos"]' || '["self-hosted","touchgrass-macos"]') }}
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.build == 'true'
    # Self-hosted Macs have no passwordless sudo: select Xcode per job.
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Verify toolchain
      run: |
        test -d "$DEVELOPER_DIR" || { echo "missing on runner: Xcode ($DEVELOPER_DIR)"; exit 1; }
    
    - name: Create Local.xcconfig
      run: |
        cat > Local.xcconfig << EOF
        DEVELOPMENT_TEAM = 
        PRODUCT_BUNDLE_IDENTIFIER = com.touchgrass.ci
        CODE_SIGN_STYLE = Manual
        CODE_SIGN_IDENTITY = 
        EOF
    
    - name: Build App
      run: |
        xcodebuild -project TouchGrass.xcodeproj \
          -scheme TouchGrass \
          -configuration Release \
          -xcconfig Local.xcconfig \
          build \
          SYMROOT=build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO
