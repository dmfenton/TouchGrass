name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect affected checks
    runs-on: ubuntu-latest
    outputs:
      test: ${{ steps.filter.outputs.test }}
      lint: ${{ steps.filter.outputs.lint }}
      build: ${{ steps.filter.outputs.build }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      if: github.event_name != 'workflow_dispatch'
      id: filter
      with:
        filters: |
          test:
            - 'Controllers/**'
            - 'Managers/**'
            - 'Models/**'
            - 'Views/**'
            - 'TouchGrassTests/**'
            - 'Tests/**'
            - 'Resources/**'
            - 'Assets/**'
            - 'TouchGrassApp.swift'
            - 'TouchGrass.xcodeproj/**'
            - 'Makefile'
            - 'scripts/test.sh'
            - '.github/workflows/ci.yml'
          lint:
            - '**/*.swift'
            - '.swiftlint.yml'
            - 'TouchGrassTests/.swiftlint.yml'
            - 'ios/.swiftlint.yml'
            - 'scripts/**'
            - 'ios/project.yml'
            - 'ios/TouchGrassMobile.xcodeproj/**'
            - 'Makefile'
            - '.github/workflows/**'
          build:
            - 'Controllers/**'
            - 'Managers/**'
            - 'Models/**'
            - 'Views/**'
            - 'Resources/**'
            - 'Assets/**'
            - 'TouchGrassApp.swift'
            - 'TouchGrass.xcodeproj/**'
            - 'TouchGrass.entitlements'
            - 'Info.plist'
            - 'Local.xcconfig.example'
            - 'AppIcon.icns'
            - 'Makefile'
            - '.github/workflows/ci.yml'

  test:
    name: Test
    runs-on: macos-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.test == 'true'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode.app
    
    - name: Run Tests
      run: make test
    
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          build/Logs/Test/*.xcresult
          TouchGrassTests/*.log
    
  lint:
    name: Lint
    runs-on: macos-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.lint == 'true'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install SwiftLint
      run: brew install swiftlint
    
    - name: Run SwiftLint
      run: |
        swiftlint lint --strict --quiet --no-cache
        swiftlint lint --strict --quiet --no-cache --config ios/.swiftlint.yml

    - name: Verify native signing policy
      run: python3 scripts/check_native_signing.py
    
  build:
    name: Build
    runs-on: macos-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.build == 'true'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode.app
    
    - name: Create Local.xcconfig
      run: |
        cat > Local.xcconfig << EOF
        DEVELOPMENT_TEAM = 
        PRODUCT_BUNDLE_IDENTIFIER = com.touchgrass.ci
        CODE_SIGN_STYLE = Manual
        CODE_SIGN_IDENTITY = 
        EOF
    
    - name: Build App
      run: |
        xcodebuild -project TouchGrass.xcodeproj \
          -scheme TouchGrass \
          -configuration Release \
          -xcconfig Local.xcconfig \
          build \
          SYMROOT=build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO
