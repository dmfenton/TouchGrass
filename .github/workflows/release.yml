name: Release Prep

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to prepare (e.g., 1.2.0)'
        required: true

jobs:
  prepare-release:
    name: Prepare Release
    # Version bump and release PR need no macOS: trusted lilserver pool.
    runs-on: ["self-hosted","touchgrass-docker","lilserver"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Validate Version
      run: |
        VERSION=${{ github.event.inputs.version }}
        if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Invalid version format. Use semantic versioning (e.g., 1.2.0)"
          exit 1
        fi
    
    - name: Update Version
      run: |
        VERSION=${{ github.event.inputs.version }}
        # Update VERSION file
        echo "$VERSION" > VERSION
        # Update Info.plist (Linux runner: no PlistBuddy)
        sed -i "/<key>CFBundleShortVersionString<\/key>/{n;s|<string>[^<]*</string>|<string>$VERSION</string>|;}" Info.plist
        grep -A1 '<key>CFBundleShortVersionString</key>' Info.plist | grep -qF "<string>$VERSION</string>" \
          || { echo "Failed to set CFBundleShortVersionString in Info.plist"; exit 1; }
    
    - name: Generate Changelog
      run: |
        VERSION=${{ github.event.inputs.version }}
        {
          echo "## Touch Grass v$VERSION"
          echo ""
          echo "### Changes since last release:"
          git log "$(git describe --tags --abbrev=0)..HEAD" --pretty=format:"- %s"
        } > RELEASE_NOTES.md
    
    - name: Create Release PR
      uses: peter-evans/create-pull-request@v7
      with:
        title: "Release v${{ github.event.inputs.version }}"
        body: |
          This PR prepares release v${{ github.event.inputs.version }}
          
          ## Checklist
          - [ ] Version updated in VERSION and Info.plist
          - [ ] Changelog reviewed
          - [ ] Tests passing
          - [ ] Manual testing completed
          
          After merging, build and sign locally with:
          ```bash
          make release VERSION=${{ github.event.inputs.version }}
          ```
        branch: release/v${{ github.event.inputs.version }}
        commit-message: "Prepare release v${{ github.event.inputs.version }}"